# L3 parameter search space (#89)
schema: enpu-tune-space-v0.1
layer: l3

params:
  min_measure_width:
    type: float
    low: 12.0
    high: 72.0
  min_gap_floor:
    type: float
    low: 10.0
    high: 36.0
  min_gap_ratio:
    type: float
    low: 0.015
    high: 0.06
  enable_cross_line:
    type: bool
  soft_gap_enabled:
    type: bool
  open_trailing_enabled:
    type: bool
  dedup_gap_factor:
    type: float
    low: 0.35
    high: 0.75

# Objective weights for layer loss
objective:
  w_iou: 1.0
  w_cnt: 0.5
  w_fn: 0.35
  w_fp: 0.25
  iou_threshold: 0.5
